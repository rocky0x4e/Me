name: Deploy on Merge

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: deploy
        run: |
          # Replace this with your restart command
          docker rm aboutMe
          docker build -t rocky/about:latest .
          docker run -d --name aboutMe -p 5000:5000 rocky/about
